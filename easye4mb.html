<!-- easyE4 über Modbus TCP / easyE4 via Modbus TCP
     Texte: locales/<sprache>/easye4mb.json, Hilfe: locales/<sprache>/easye4mb.html (de, en-US) -->

<!-- ===================== gemeinsame Hilfsfunktionen / shared editor helpers ===================== -->
<script type="text/javascript">
    (function () {
        function val(id, node, key) {
            var $e = $(id);
            return $e.length ? $e.val() : node[key];
        }
        function intOk(v, min, max) {
            var s = String(v === undefined || v === null ? "" : v).trim();
            if (!/^\d+$/.test(s)) return false;
            var n = parseInt(s, 10);
            return n >= min && n <= max;
        }
        // Höchstindex je Firmware (wie lib/easye4mb-map.js)
        function maxIndex(t, fw) {
            var hi = fw === "240";
            var m = { I: 128, Q: 128, ID: 96, N: 512, NB: 64, NW: 32, ND: 16,
                M: hi ? 1024 : 512, MB: hi ? 2044 : 1024, MW: hi ? 1022 : 512, MD: hi ? 511 : 256,
                IA: hi ? 512 : 48, QA: hi ? 128 : 48 };
            return m[t] || 0;
        }
        function mwReg(n) { return n <= 512 ? 1000 + n : 46000 + n; }
        // Register-Anzeige für einen Operanden, z. B. "FC3 · Reg. 1003"
        function regText(t, n, fw) {
            n = parseInt(n, 10);
            if (!(n >= 1)) return "?";
            switch (t) {
                case "I": return "FC2 · " + n;
                case "Q": return "FC1 · " + n;
                case "ID": return "FC2 · " + (3000 + n);
                case "M": return "FC1 · " + (n <= 512 ? 1000 + n : 56000 + n);
                case "N": return "FC1 · " + (2000 + n);
                case "MW": return "FC3 · " + mwReg(n);
                case "NW": return "FC3 · " + (2000 + n);
                case "MB": return "FC3 · " + mwReg(Math.ceil(n / 2)) + (n % 2 ? " (Low-Byte)" : " (High-Byte)");
                case "NB": return "FC3 · " + (2000 + Math.ceil(n / 2)) + (n % 2 ? " (Low-Byte)" : " (High-Byte)");
                case "MD": return "FC3 · " + mwReg(2 * n - 1) + "+" + mwReg(2 * n);
                case "ND": return "FC3 · " + (2000 + 2 * n - 1) + "+" + (2000 + 2 * n);
                case "IA": case "QA": {
                    var fc = t === "IA" ? "FC4 · " : "FC3 · ";
                    if (fw === "240") { var b = t === "IA" ? 42000 : 40000; return fc + (b + 2 * n - 1) + "+" + (b + 2 * n); }
                    if (fw === "140") { var c = t === "IA" ? 6500 : 6000; return fc + (c + 2 * n - 1) + "+" + (c + 2 * n); }
                    return fc + n;
                }
            }
            return "?";
        }
        function fwOf(node) {
            var id = $("#node-input-device").length ? $("#node-input-device").val() : node.device;
            var d = id && RED.nodes.node(id);
            return d && d.firmware ? d.firmware : "240";
        }

        window.easyE4Mb = {
            regText: regText,
            shortLabel: function (n) {
                var m = n.mode || "operand";
                if (m === "operand") return (n.opType || "MW") + (n.index || "?");
                if (m === "range") return (n.opType || "MW") + (n.index || "?") + "–" + (n.opType || "MW") + (n.rangeEnd || "?");
                if (m === "clock") return "CLOCK";
                if (m === "raw") return "FC" + (n.fc || "?") + ":" + (n.addr || "?");
                var s = String(n.list || "").split(/\n/).join(" ").trim();
                return s.length > 25 ? s.slice(0, 22) + "..." : s;
            },
            vIndex: function (v) {
                var m = val("#node-input-mode", this, "mode") || "operand";
                if (m !== "operand" && m !== "range") return true;
                var t = val("#node-input-opType", this, "opType") || "MW";
                return intOk(v, 1, maxIndex(t, "240"));
            },
            vRangeEnd: function (v) {
                var m = val("#node-input-mode", this, "mode") || "operand";
                if (m !== "range") return true;
                var t = val("#node-input-opType", this, "opType") || "MW";
                var a = parseInt(val("#node-input-index", this, "index"), 10);
                return intOk(v, 1, maxIndex(t, "240")) && parseInt(v, 10) >= a;
            },
            vList: function (v) {
                var m = val("#node-input-mode", this, "mode") || "operand";
                return m !== "list" || String(v || "").trim().length > 0;
            },
            vAddr: function (v) {
                var m = val("#node-input-mode", this, "mode") || "operand";
                return m !== "raw" || intOk(v, 1, 65536);
            },
            vCount: function (v) {
                var m = val("#node-input-mode", this, "mode") || "operand";
                if (m !== "raw") return true;
                var fc = val("#node-input-fc", this, "fc");
                return intOk(v, 1, fc === "1" || fc === "2" ? 512 : 125);
            },
            // Felder je nach Auswahl ein-/ausblenden und Register-Vorschau zeigen
            bind: function (node, isWrite) {
                function update() {
                    var m = $("#node-input-mode").val();
                    var t = $("#node-input-opType").val();
                    var fw = fwOf(node);
                    $(".e4m-op").toggle(m === "operand" || m === "range");
                    $(".e4m-end").toggle(m === "range");
                    $(".e4m-list").toggle(m === "list");
                    $(".e4m-raw").toggle(m === "raw");
                    $(".e4m-count").toggle(m === "raw" && !isWrite);
                    $(".e4m-poll").toggle(m !== "msg");
                    var txt = "–";
                    if (m === "operand") txt = regText(t, $("#node-input-index").val(), fw);
                    if (m === "range") txt = regText(t, $("#node-input-index").val(), fw) + "  …  " + regText(t, $("#node-input-rangeEnd").val(), fw);
                    if (m === "clock") txt = isWrite ? "FC16 · 5000–5005" : "FC3 · 5000–5005";
                    if (m === "raw") txt = "FC" + $("#node-input-fc").val() + " · " + ($("#node-input-addr").val() || "?") +
                        (isWrite ? "" : " ×" + ($("#node-input-count").val() || 1));
                    if (isWrite && m === "operand") {
                        if (t === "M" || t === "N") txt = txt.replace("FC1", "FC5");
                        else if (t === "MD" || t === "ND") txt = txt.replace("FC3", "FC16");
                        else if (t === "MB" || t === "NB") txt = txt.replace("FC3", "FC3+FC6");
                        else txt = txt.replace("FC3", "FC6");
                    }
                    $("#e4m-preview").text(txt);
                    $("#node-input-index, #node-input-rangeEnd, #node-input-list, #node-input-addr, #node-input-count").trigger("validate");
                }
                $("#node-input-mode, #node-input-opType, #node-input-fc, #node-input-device").on("change", update);
                $("#node-input-index, #node-input-rangeEnd, #node-input-list, #node-input-addr, #node-input-count").on("input change", update);
                update();
            },
        };
    })();
</script>

<!-- ===================== Steuerung (Konfiguration) ===================== -->
<script type="text/javascript">
    RED.nodes.registerType("easye4mb-device", {
        category: "config",
        defaults: {
            name: { value: "" },
            host: { value: "", required: true },
            port: { value: 502, validate: function (v) { return /^\d+$/.test(String(v)) && +v > 0 && +v < 65536; } },
            unitId: { value: 1, validate: function (v) { return /^\d+$/.test(String(v)) && +v <= 255; } },
            firmware: { value: "240" },
            addressing: { value: "direct" },
            timeout: { value: 2000, validate: function (v) { return /^\d+$/.test(String(v)) && +v >= 200 && +v <= 30000; } },
            gap: { value: 20, validate: function (v) { return v === undefined || v === "" || (/^\d+$/.test(String(v)) && +v <= 5000); } },
        },
        label: function () {
            return this.name || ("easyE4 " + (this.host || "Modbus"));
        },
        paletteLabel: "easyE4 Modbus",
        oneditprepare: function () {
            var node = this;
            // Einträge aus älteren Fassungen haben noch keine Adressierung
            if (!$("#node-config-input-addressing").val()) $("#node-config-input-addressing").val("direct");
            $("#e4m-test").on("click", function (ev) {
                ev.preventDefault();
                var $r = $("#e4m-test-result");
                $r.css("color", "").text(node._("easye4mb.test.running"));
                var body = {
                    host: $("#node-config-input-host").val(),
                    port: $("#node-config-input-port").val(),
                    unitId: $("#node-config-input-unitId").val(),
                    firmware: $("#node-config-input-firmware").val(),
                    addressing: $("#node-config-input-addressing").val(),
                    timeout: $("#node-config-input-timeout").val(),
                    lang: RED.i18n.lang(),
                };
                $.ajax({
                    url: "easye4mb/test",
                    type: "POST",
                    contentType: "application/json",
                    data: JSON.stringify(body),
                    success: function (res) {
                        if (res.suggest) $("#node-config-input-addressing").val(res.suggest);
                        $r.css("color", res.ok ? (res.warn ? "#c80" : "#3a3") : "#c33").text(res.text);
                    },
                    error: function (xhr) {
                        $r.css("color", "#c33").text(node._("easye4mb.test.failed") + ": " + (xhr.responseText || xhr.status));
                    },
                });
            });
        },
    });
</script>

<script type="text/javascript">
    RED.nodes.registerType("easye4mb-read", {
        category: "easyE4",
        color: "#a6bbcf",
        defaults: {
            name: { value: "" },
            device: { type: "easye4mb-device", required: true },
            mode: { value: "operand" },
            opType: { value: "MW" },
            index: { value: 1, validate: easyE4Mb.vIndex },
            rangeEnd: { value: 8, validate: easyE4Mb.vRangeEnd },
            list: { value: "", validate: easyE4Mb.vList },
            fc: { value: "3" },
            addr: { value: 1001, validate: easyE4Mb.vAddr },
            count: { value: 1, validate: easyE4Mb.vCount },
            interval: { value: 1, validate: function (v) { var s = String(v === undefined ? "" : v).trim().replace(",", "."); return /^\d+(\.\d+)?$/.test(s) && (+s === 0 || +s >= 0.1); } },
            onlyChange: { value: false },
        },
        inputs: 1,
        outputs: 1,
        icon: "font-awesome/fa-sign-in",
        label: function () {
            if (this.name) return this.name;
            if (this.mode === "msg") return this._("easye4mb.read.label");
            return this._("easye4mb.read.label") + ": " + easyE4Mb.shortLabel(this);
        },
        paletteLabel: function () { return this._("easye4mb.read.paletteLabel"); },
        inputLabels: function () { return this._("easye4mb.read.input"); },
        outputLabels: function () { return this._("easye4mb.read.output"); },
        oneditprepare: function () { easyE4Mb.bind(this, false); },
    });
</script>
